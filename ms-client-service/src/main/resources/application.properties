spring.application.name=ms-client-service
server.port=8080

# Logging Log4j2
logging.config=classpath:log4j2.xml

# PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT (debe ser identico al de ms-transaction-service para validar la misma firma)
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=3600000

# AES encryption for sensitive fields (32 caracteres exactos)
crypto.aes.secret=${AES_SECRET}

# gRPC server
spring.grpc.server.port=9090
