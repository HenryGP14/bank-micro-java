spring.application.name=ms-transaction-service
server.port=8081

# Logging Log4j2
logging.config=classpath:log4j2.xml

# PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT (debe ser identico al de ms-client-service para validar la misma firma)
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=3600000

# Rate limiting (anti abuso / DDoS) aplicado a todas las rutas REST
rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
# Cuota por IP remota
rate-limit.per-ip.capacity=${RATE_LIMIT_PER_IP_CAPACITY:100}
rate-limit.per-ip.refill-period=1m
# Techo total del microservicio (todas las IPs sumadas)
rate-limit.global.capacity=${RATE_LIMIT_GLOBAL_CAPACITY:2000}
rate-limit.global.refill-period=1m

# gRPC client hacia ms-client-service
spring.grpc.client.channel.client-service.target=static://${CLIENT_SERVICE_HOST}:9090